<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--red:#d64545;--amber:#e39b2d;--green:#3a9d5d;--ink:#1f2a24;--mute:#6b766f;--line:#e3e7e4;--bg:#f6f7f5;--brand:#2f6b4f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:16px;margin:0;flex:1;min-width:150px}
  .btn{border:0;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.55;cursor:wait}
  #filters{display:flex;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
  .chip.on{border-color:var(--ink);background:#eef2ef}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  select,input,textarea{font:inherit;font-size:16px;padding:9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
  #filters select{width:auto;font-size:13px;padding:5px 8px}
  #wrap{flex:1;position:relative;display:flex;min-height:0}
  #map{flex:1;background:#e9ece9}
  #banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:900;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;display:none;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  #banner button{background:#fff;color:var(--ink);border:0;border-radius:6px;padding:5px 9px;font-weight:600}
  #panel{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);max-height:78%;overflow:auto;transform:translateY(105%);transition:transform .25s}
  #panel.open{transform:none}
  @media(min-width:820px){
    #panel{position:relative;transform:none;width:0;max-height:none;border-radius:0;box-shadow:none;border-left:1px solid var(--line);transition:width .2s}
    #panel.open{width:390px}
  }
  .pin{padding:16px}
  .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .ph h2{font-size:17px;margin:0}
  .x{background:none;border:0;font-size:24px;cursor:pointer;color:var(--mute);line-height:1}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
  .req{color:var(--red)}
  .badge{display:inline-block;color:#fff;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}
  .meta{color:var(--mute);font-size:13px;margin:4px 0}
  .photo{width:100%;border-radius:10px;margin:8px 0;display:block;background:#eee;min-height:80px;object-fit:cover}
  .preview{max-height:180px;object-fit:cover}
  .hist{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0}
  .hist img{width:90px;height:68px;object-fit:cover;border-radius:6px;margin-top:5px;cursor:pointer}
  .row{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
  .row:hover{background:var(--bg)}
  .row img{width:56px;height:44px;object-fit:cover;border-radius:6px;background:#eee;flex:none}
  .row .t{flex:1;min-width:0}
  .row .t b{font-size:14px}
  .row .t div{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:2000;display:none;max-width:90%}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:500;color:var(--mute);font-size:15px}
  .leaflet-container{cursor:grab}
  .placing .leaflet-container{cursor:crosshair}
</style>
</head>
<body>
<header>
  <h1 id="title">Landscape Tracker</h1>
  <button class="btn ghost" id="listBtn">List</button>
  <button class="btn" id="reportBtn">+ Report issue</button>
</header>
<div id="filters"></div>
<div id="wrap">
  <div id="map"><div id="loading">Loading map…</div></div>
  <div id="banner">Tap the map where the issue is <button id="cancelPlace">Cancel</button></div>
  <div id="panel"></div>
</div>
<div id="toast"></div>

/* ---------- utilities ---------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function img(id, w){ return id ? 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w||1000) : ''; }
function full(id){ return 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view'; }
function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return ''; const d = s.length===10 ? new Date(s+'T12:00:00') : new Date(s); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function fmtDT(s){ return s ? new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}) : ''; }
function daysSince(s){ return Math.max(0, Math.floor((Date.now() - new Date(s+'T12:00:00')) / 864e5)); }
function badge(s){ return '<span class="badge" style="background:'+(COLORS[s]||'#888')+'">'+esc(s)+'</span>'; }
function toast(msg, ms){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms||3500); }
function call(fn, arg){
  // Inside Apps Script: use google.script.run. Hosted elsewhere: talk to the /exec URL.
  if (window.google && google.script && google.script.run)
    return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](arg));
  const check = d => { if (d && d.error) throw new Error(d.error); return d; };
  if (fn === 'getConfig' || fn === 'getData')
    return fetch(API_URL + '?action=' + (fn === 'getConfig' ? 'config' : 'data')).then(r => r.json()).then(check);
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: fn }, arg)) }).then(r => r.json()).then(check);
}
function toLatLng(i){ return [(1 - i.y) * H, i.x * W]; }

/* Resize + compress a phone photo to JPEG base64 (keeps uploads fast) */
function compress(file){
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const max = 1600, s = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.72).split(',')[1]);
    };
    im.onerror = () => no(new Error('Could not read that photo. Try a JPG or PNG.'));
    im.src = url;
  });
}

function wirePreview(id){
  $(id).addEventListener('change', e => {
    const f = e.target.files[0], p = $(id+'Prev');
    if (f){ p.src = URL.createObjectURL(f); p.style.display = 'block'; } else p.style.display = 'none';
  });
}

/* ---------- init ---------- */
call('getConfig').then(cfg => {
  CFG = cfg;
  $('title').textContent = cfg.name;
  document.title = cfg.name;
  buildFilters();
  const im = new Image();
  im.onload = () => {
    W = im.naturalWidth; H = im.naturalHeight;
    $('loading').remove();
    map = L.map('map', { crs: L.CRS.Simple, minZoom: -4, maxZoom: 3, zoomSnap: 0.25, attributionControl: false });
    const b = [[0,0],[H,W]];
    L.imageOverlay(MAP_URL, b).addTo(map);
    map.fitBounds(b);
    map.setMaxBounds([[-H*0.25,-W*0.25],[H*1.25,W*1.25]]);
    map.setMinZoom(map.getZoom() - 1);
    layer = L.layerGroup().addTo(map);
    map.on('click', onMapClick);
    refresh();
    setInterval(() => { if (!document.hidden) refresh(true); }, 60000);
  };
  im.src = MAP_URL;
}).catch(e => { $('loading').textContent = 'Error: ' + e.message; });

function refresh(quiet){
  return call('getData').then(d => { issues = d; render(); if (currentId && !quiet) showIssue(currentId); })
    .catch(e => { if (!quiet) toast('Could not load issues: ' + e.message); });
}

/* ---------- filters ---------- */
function buildFilters(){
  const f = $('filters');
  f.innerHTML = CFG.statuses.map(s =>
    '<span class="chip'+(filter.status.has(s)?' on':'')+'" data-s="'+esc(s)+'"><span class="dot" style="background:'+COLORS[s]+'"></span>'+esc(s)+' <b data-c="'+esc(s)+'">0</b></span>'
  ).join('') +
  '<select id="catSel"><option>All</option>' + CFG.categories.map(c => '<option>'+esc(c)+'</option>').join('') + '</select>';
  f.querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
    const s = ch.dataset.s;
    filter.status.has(s) ? filter.status.delete(s) : filter.status.add(s);
    ch.classList.toggle('on'); render();
  });
  $('catSel').onchange = e => { filter.cat = e.target.value; render(); };
}
function visible(){ return issues.filter(i => filter.status.has(i.status) && (filter.cat==='All' || i.category===filter.cat)); }

/* ---------- map pins ---------- */
function render(){
  if (!layer) return;
  layer.clearLayers();
  CFG.statuses.forEach(s => { const el = document.querySelector('[data-c="'+s+'"]'); if (el) el.textContent = issues.filter(i=>i.status===s).length; });
  visible().forEach(i => {
    L.circleMarker(toLatLng(i), { radius: 10, color: '#fff', weight: 2.5, fillColor: COLORS[i.status] || '#888', fillOpacity: 1 })
      .bindTooltip(esc(i.category) + (i.unit ? ' · near ' + esc(i.unit) : ''))
      .on('click', e => { L.DomEvent.stopPropagation(e); showIssue(i.id); })
      .addTo(layer);
  });
  if (panel.dataset.view === 'list') showList();
}

/* ---------- report flow ---------- */
$('reportBtn').onclick = () => {
  placing = true; closePanel();
  document.body.classList.add('placing');
  $('banner').style.display = 'flex';
};
$('cancelPlace').onclick = stopPlacing;
function stopPlacing(){
  placing = false; document.body.classList.remove('placing'); $('banner').style.display = 'none';
}
function onMapClick(e){
  if (!placing) return;
  const x = e.latlng.lng / W, y = 1 - e.latlng.lat / H;
  if (x < 0 || x > 1 || y < 0 || y > 1) return toast('Tap inside the map.');
  stopPlacing();
  if (tempMarker) map.removeLayer(tempMarker);
  tempMarker = L.circleMarker(e.latlng, { radius: 11, color: '#1f2a24', weight: 3, fillColor: '#fff', fillOpacity: 1 }).addTo(map);
  showNewForm(x, y);
}

function showNewForm(x, y){
  openPanel('new',
    '<div class="ph"><h2>Report an issue</h2><button class="x" id="closeP">×</button></div>' +
    '<label>Type of issue</label><select id="fCat">' + CFG.categories.map(c=>'<option>'+esc(c)+'</option>').join('') + '</select>' +
    '<label>Date noticed</label><input type="date" id="fDate" value="'+today()+'" max="'+today()+'">' +
    '<label>Nearest unit # (optional)</label><input id="fUnit" inputmode="numeric" maxlength="20" placeholder="e.g. 3">' +
    '<label>Notes</label><textarea id="fNote" rows="3" maxlength="1000" placeholder="What did you see? Size, how long, etc."></textarea>' +
    photoField('fPhoto') +
    '<div style="margin-top:14px;display:flex;gap:8px"><button class="btn" id="fSubmit" style="flex:1">Submit report</button><button class="btn ghost" id="fMove">Move pin</button></div>'
  );
  wirePreview('fPhoto');
  $('fMove').onclick = () => $('reportBtn').onclick();
  $('fSubmit').onclick = async () => {
    const file = $('fPhoto').files[0];
    if (!file) return toast('Please add a photo — it is required.');
    const btn = $('fSubmit'); btn.disabled = true; btn.textContent = 'Uploading…';
    try {
      const photo = await compress(file);
      issues = await call('addIssue', { x, y, category: $('fCat').value, noted: $('fDate').value,
        unit: $('fUnit').value, note: $('fNote').value, photo });
      if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
      filter.status.add('Reported'); buildFilters(); render();
      const newest = issues.slice().sort((a,b)=>b.created.localeCompare(a.created))[0];
      toast('Thanks! Issue reported.');
      if (newest) showIssue(newest.id);
    } catch (e) { toast('Error: ' + e.message, 6000); btn.disabled = false; btn.textContent = 'Submit report'; }
  };
}

/* ---------- issue detail + update ---------- */
function showIssue(id){
  const i = issues.find(z => z.id === id); if (!i) return;
  currentId = id;
  const open = i.status !== 'Fixed';
  const hist = i.history.slice().reverse().map(h =>
    '<div class="hist">' + badge(h.status) + ' <span class="meta">' + fmtDT(h.at) + '</span>' +
    (h.note ? '<div style="font-size:14px;margin-top:4px;white-space:pre-wrap">' + esc(h.note) + '</div>' : '') +
    (h.photo ? '<a href="'+full(h.photo)+'" target="_blank"><img src="'+img(h.photo,300)+'" loading="lazy"></a>' : '') +
    '</div>').join('');
  openPanel('issue',
    '<div class="ph"><h2>' + esc(i.category) + '</h2><button class="x" id="closeP">×</button></div>' +
    badge(i.status) + ' <span class="meta">#' + esc(i.id) + '</span>' +
    '<a href="'+full(i.photo)+'" target="_blank"><img class="photo" src="'+img(i.photo)+'"></a>' +
    '<div class="meta"><b>Noticed:</b> ' + fmtDate(i.noted) + (open ? ' · <b>' + daysSince(i.noted) + ' days open</b>' : '') + '</div>' +
    (i.unit ? '<div class="meta"><b>Near unit:</b> ' + esc(i.unit) + '</div>' : '') +
    '<div class="meta"><b>Last update:</b> ' + fmtDT(i.updated) + '</div>' +
    '<hr><h3 style="font-size:15px;margin:0">Update this issue</h3>' +
    '<label>Status</label><select id="uStatus">' + CFG.statuses.map(s => '<option'+(s===i.status?' selected':'')+'>'+esc(s)+'</option>').join('') + '</select>' +
    '<label>Note</label><textarea id="uNote" rows="3" maxlength="1000" placeholder="What changed?"></textarea>' +
    photoField('uPhoto') +
    '<button class="btn" id="uSubmit" style="width:100%;margin-top:14px">Save update</button>' +
    '<hr><h3 style="font-size:15px;margin:0 0 6px">History</h3>' + hist
  );
  wirePreview('uPhoto');
  map.panTo(toLatLng(i));
  $('uSubmit').onclick = async () => {
    const file = $('uPhoto').files[0];
    if (!file) return toast('Please add a photo — it is required.');
    const btn = $('uSubmit'); btn.disabled = true; btn.textContent = 'Uploading…';
    try {
      const photo = await compress(file);
      const status = $('uStatus').value;
      issues = await call('updateIssue', { id: i.id, status, note: $('uNote').value, photo });
      filter.status.add(status); buildFilters(); render();
      toast('Update saved.'); showIssue(i.id);
    } catch (e) { toast('Error: ' + e.message, 6000); btn.disabled = false; btn.textContent = 'Save update'; }
  };
}

/* ---------- list view ---------- */
$('listBtn').onclick = () => panel.dataset.view === 'list' && panel.classList.contains('open') ? closePanel() : showList();
function showList(){
  const v = visible().sort((a,b) => (a.status==='Fixed') - (b.status==='Fixed') || a.noted.localeCompare(b.noted));
  openPanel('list',
    '<div class="ph"><h2>' + v.length + ' issue' + (v.length===1?'':'s') + '</h2><button class="x" id="closeP">×</button></div>' +
    (v.length ? '' : '<p class="meta">Nothing matches the filters above.</p>') +
    v.map(i => '<div class="row" data-id="'+esc(i.id)+'"><img src="'+img(i.photo,200)+'" loading="lazy"><div class="t"><b>' + esc(i.category) + '</b>' +
      '<div>' + badge(i.status) + ' ' + fmtDate(i.noted) + (i.status!=='Fixed' ? ' · ' + daysSince(i.noted) + 'd' : '') + (i.unit ? ' · unit ' + esc(i.unit) : '') + '</div>' +
      '<div>' + esc(i.latestNote || i.note) + '</div></div></div>').join('')
  );
  panel.querySelectorAll('.row').forEach(r => r.onclick = () => {
    const i = issues.find(z => z.id === r.dataset.id);
    map.setView(toLatLng(i), Math.max(map.getZoom(), 0)); showIssue(i.id);
  });
}

/* ---------- panel ---------- */
function openPanel(view, html){
  panel.dataset.view = view; panel.innerHTML = '<div class="pin">' + html + '</div>';
  panel.classList.add('open'); panel.scrollTop = 0;
  $('closeP').onclick = closePanel;
  setTimeout(() => map && map.invalidateSize(), 250);
}
function closePanel(){
  panel.classList.remove('open'); panel.dataset.view = ''; currentId = null;
  if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
  setTimeout(() => map && map.invalidateSize(), 250);
}
</script>
</body>
</html>
